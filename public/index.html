<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Robot Quotes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding:20px;
        }

        .container {
            text-align: center;
            max-width: 700px;
            width: 100%;
            padding: 40px;
            border: 1px solid #00ff41;
            background: rgba(0, 255, 65, 0.02);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
        }

        .terminal-header {
            text-align: left;
            margin-bottom: 30px;
            font-size: 12px;
            color: #00aa2a;
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .title {
            font-size: 32px;
            letter-spacing: 6px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
            margin-bottom: 5px;
        }

        .subtitle {
            color: #00aa2a;
            font-size: 11px;
            letter-spacing: 5px;
            margin-bottom: 40px;
        }

        /* Mode buttons */
        .mode-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: transparent;
            color: #00aa2a;
            border: 1px solid #00aa2a;
            padding: 8px 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: #00ff41;
            color: #0a0a0a;
            border-color: #00ff41;
        }

        .mode-btn:hover {
            border-color: #00ff41;
            color: #00ff41;
        }

        /* Theme selector */
        .theme-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .theme-label {
            color:  #00aa2a;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .theme-dropdown {
            background: #0a0a0a;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 6px 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            letter-spacing: 1px;
            min-width: 200px;
        }

        .theme-dropdown:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }

        .theme-dropdown option {
            background: #0a0a0a;
            color: #00ff41;
        }

        /* Quote Box */
        .quote-box {
            min-height: 150px;
            padding: 25px;
            border-left: 3px solid #00ff41;
            text-align: left;
            margin-bottom: 25px;
            position: relative;
        }

        .quote-text {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .quote-character {
            font-size: 13px;
            color: #00aa2a;
            text-align: right;
        }

        .quote-category {
            display: inline-block;
            font-size: 10px;
            background: #00ff41;
            color: #0a0a0a;
            padding: 2px 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 10px;
        }

         /* SVG preview box */
        .svg-preview {
            display: none;
            padding: 20px;
            background: #050505;
            border: 1px dashed #00aa2a;
            margin-bottom: 25px;
            border-radius: 8px;
        }

        .svg-preview.active {
            display: block;
        }

        .svg-preview img {
            max-width: 100%;
            display: block;
            margin: 0 auto;
        }

        /* Loading state */
        .loading-text {
            color: #00aa2a;
            font-size: 14px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* AI Badge */
        .ai-badge {
            font-size: 10px;
            color: #00aa2a;
            border: 1px solid #00aa2a;
            padding: 3px 10px;
            letter-spacing: 2px;
            display: inline-block;
            margin-bottom: 20px;
        }

        /* Generate Button */
        .generate-btn {
            background: transparent;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 14px 35px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            cursor: pointer;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s;
            display: block;
            width: 100%;
            margin-top: 10px;
        }

        .generate-btn:hover:not(:disabled) {
            background: #00ff41;
            color: #0a0a0a;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }

        .generate-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Copy URL section */
        .copy-section {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #00aa2a;
            border-radius: 4px;
            background: rgba(0, 255, 65, 0.03);
        }

        .copy-section.active {
            display: block;
        }

        .copy-label {
            font-size: 10px;
            color: #00aa2a;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .copy-url {
            background: #050505;
            color: #00ff41;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            border: none;
            width: 100%;
            word-break: break-all;
            resize: none;
            min-height: 60px;
        }

        .copy-btn {
            background: transparent;
            color: #00aa2a;
            border: 1px solid #00aa2a;
            padding: 6px 15px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            cursor: pointer;
            letter-spacing: 2px;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            background: #00ff41;
            color: #0a0a0a;
            border-color: #00ff41;
        }

        /* Status bar */
        .status-bar {
            font-size: 10px;
            color: #00aa2a;
            margin-top: 15px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Terminal header -->
    <div class="terminal-header">
        guest@fsociety:~$ connect --ai-quotes<span class="blink">█</span>
    </div>

    <!-- Title -->
    <h1 class="title">MR. ROBOT</h1>
    <p class="subtitle">AI QUOTE TERMINAL</p>

    <!-- AI Badge -->
    <div class="ai-badge">⚡ POWERED BY RIPPLE AI</div>

    <!-- Mode Toggle -->
    <div class="mode-buttons">
        <button class="mode-btn active" id="btn-random" onclick="setMode('random')">
            RANDOM
        </button>
        <button class="mode-btn" id="btn-daily" onclick="setMode('daily')">
            DAILY
        </button>
        <button class="mode-btn" id="btn-svg" onclick="setMode('svg')">
            SVG CARD
        </button>
    </div>

    <!-- Theme Selector (visible only in SVG mode) -->
    <div class="theme-selector" id="themeSelector" style="display: none;">
        <span class="theme-label">THEME:</span>
        <select class="theme-dropdown" id="themeDropdown" onchange="fetchQuoteText()">
            <option value="mrrobot">Mr. Robot</option>
            <option value="hacker">Hacker</option>
            <option value="cyberpunk">Cyberpunk</option>
            <option value="dracula">Dracula</option>
            <option value="tokyonight">Tokyo Night</option>
            <option value="nord">Nord</option>
            <option value="gruvbox">Gruvbox</option>
            <option value="monokai">Monokai</option>
            <option value="catppuccin">Catppuccin</option>
            <option value="catppuccin_mocha">Catppuccin Mocha</option>
            <option value="catppuccin_macchiato">Catppuccin Macchiato</option>
            <option value="catppuccin_frappe">Catppuccin Frappe</option>
            <option value="catppuccin_latte">Catppuccin Latte</option>
            <option value="github_dark">GitHub Dark</option>
            <option value="github_blue">GitHub Blue</option>
            <option value="github">GitHub</option>
            <option value="radical">Radical</option>
            <option value="merko">Merko</option>
            <option value="algolia">Algolia</option>
            <option value="chartreuse_dark">Chartreuse Dark</option>
            <option value="moonlight">Moonlight</option>
            <option value="hackerman">Hackerman</option>
            <option value="shadow_red">Shadow Red</option>
            <option value="shadow_green">Shadow Green</option>
            <option value="shadow_blue">Shadow Blue</option>
            <option value="default_dark">Default Dark</option>
            <option value="default">Default</option>
            <option value="graywhite">Gray White</option>
        </select>
    </div>

    <!-- Sub-mode for SVG (random or daily inside SVG) -->
     <div class="mode-buttons" id="svgSubMode" style="display: none;">
        <button class="mode-btn active" id="svg-daily" onclick="setSvgMode('daily')">
            SVG DAILY
        </button>
        <button class="mode-btn" id="svg-random" onclick="setSvgMode('random')">
            SVG RANDOM
        </button>
     </div>

    <!-- Quote Display Box -->
    <div class="quote-box" id="quoteBox">
        <p class="quote-text" id="quoteText">
            <span class="loading-text">Initializing connection to fsociety...</span>
        </p>
        <p class="quote-character" id="quoteCharacter"></p>
        <span class="quote-category" id="quoteCategory" style="display:none;"></span>
    </div>
    
    <!-- SVG Preview Box -->
     <div class="svg-preview" id="svgPreview">
        <img id="svgImage" alt="SVG Quote"/>
     </div>
    
    <!-- Copy URL Section -->
    <div class="copy-section" id="copySection">
        <div class="copy-label">EMBED URL (paste in your GitHub README):</div>
        <textarea class="copy-url" id="copyUrl" readonly onclick="this.select()"></textarea>
        <button class="copy-btn" onclick="copyToClipboard()">COPY URL</button>
        <button class="copy-btn" onclick="copyMarkdown()">COPY MARKDOWN</button>
    </div>
    
    
    <!-- Generate Button -->
    <button class="generate-btn" id="generateBtn" onclick="fetchQuoteText()">
        &gt; GENERATE QUOTE_
    </button>

    <!-- Status -->
    <p class="status-bar" id="statusBar">Ready.</p>

</div>

<script>
    let currentMode = 'random';
    let svgMode = 'daily';

    // Switch between random and daily mode
    function setMode(mode) {
        currentMode = mode;

        // Update button styles
        document.getElementById('btn-random').classList.toggle('active', mode === 'random');
        document.getElementById('btn-daily').classList.toggle('active', mode === 'daily');
        document.getElementById('btn-svg').classList.toggle('active', mode === 'svg');

        //show/hide relevant sections
        const isSvg = mode === 'svg';
        document.getElementById('themeSelector').style.display = isSvg ? 'flex' : 'none';
        document.getElementById('svgSubMode').style.display = isSvg ? 'flex' : 'none';
        document.getElementById('quoteBox').style.display = isSvg ? 'none' : 'block';
        document.getElementById('svgPreview').classList.toggle('active', isSvg);
        document.getElementById('copySection').classList.toggle('active', isSvg);

        // Fetch quote for selected mode
        fetchQuoteText();
    }

    // Switch SVG sub mode
    function setSvgMode(mode){
        svgMode = mode;
        document.getElementById('svg-daily').classList.toggle('active', mode === 'daily');
        document.getElementById('svg-random').classList.toggle('active', mode === 'random');
        fetchQuoteText();
    }

    async function fetchQuoteText() {
        const generateBtn = document.getElementById('generateBtn');
        const statusBar = document.getElementById('statusBar');

        generateBtn.disabled = true;
        if (currentMode === 'svg'){
            await fetchSvg();
        } else {
            await fetchQuote();
        }
        generateBtn.disabled = false;
    }

    // Main function to get quote from your API
    async function fetchQuote() {
        const quoteText = document.getElementById('quoteText');
        const quoteCharacter = document.getElementById('quoteCharacter');
        const quoteCategory = document.getElementById('quoteCategory');
        const statusBar = document.getElementById('statusBar');

        // Show loading state
        quoteText.innerHTML = '<span class="loading-text"> 🤖 Ripple is generating your quote...</span>';
        quoteCharacter.textContent = '';
        quoteCategory.style.display = 'none';
        statusBar.textContent = 'Connecting to Ripple AI...';

        try {
            // Pick endpoint based on mode
            const endpoint = currentMode === 'daily'
                ? '/api/quote/daily'
                : '/api/quote/random';

            const response = await fetch(endpoint);
            const data = await response.json();

            if (data.success) {
                const quote = data.quote;

                // Typing effect for the quote text
                await typeWriter(quote.text, quoteText);

                // Show character
                quoteCharacter.textContent = `— ${quote.character}`;

                // Show category badge
                if (quote.category) {
                    quoteCategory.textContent = quote.category;
                    quoteCategory.style.display = 'inline-block';
                }

                // Update status bar
                const isCache = data.generated === 'cached';
                const isFallback = data.generated === 'fallback';
                statusBar.textContent = isCache
                    ? `Today's cached quote | Date: ${data.date}`
                    : isFallback
                        ? `AI unavailable, served a local quote`
                        : `Fresh quote generated by AI`;

            } else {
                quoteText.textContent = 'ERROR: ' + data.error;
                statusBar.textContent = 'Failed to generate quote.';
            }

        } catch (error) {
            quoteText.textContent = 'CONNECTION FAILED. Check if server is running.';
            statusBar.textContent = 'Error: ' + error.message;
        }

    }

    // fetch SVG quote Card
    async function fetchSvg() {
        const svgImage = document.getElementById('svgImage');
        const copyUrl = document.getElementById('copyUrl');
        const statusBar = document.getElementById('statusBar');
        const theme = document.getElementById('themeDropdown').value;

        statusBar.textContent = "Generating SVG card....";

        // build url
        const baseUrl = window.location.origin;
        const svgUrl = `${baseUrl}/api/quote/svg?theme=${theme}&mode=${svgMode}&t=${Date.now()}`;

        // Public URL (without cache buster) for embedding
        const publicUrl = `${baseUrl}/api/quote/svg?theme=${theme}&mode=${svgMode}`;

        // set image
        svgImage.src = svgUrl;

        // set url for copying
        copyUrl.value = publicUrl;

        svgImage.onload = () => {
            statusBar.textContent = `SVG Generated | Theme: ${theme} | Mode: ${svgMode}`;
        };
        
        svgImage.onerror = () => {
            statusBar.textContent = 'Failed to load SVG';
        };
    }

    //Copy url to clipboard
    async function copyToClipboard() {
        const copyUrl = document.getElementById('copyUrl');
        const statusBar = document.getElementById('statusBar');

        try {
            await navigator.clipboard.writeText(copyUrl.value);
            statusBar.textContent = 'URL Copied to Clipboard!';
        } catch (err) {
            statusBar.textContent = 'Copy Failed';
            copyUrl.select();
            consle.error('Clipboard error:', err);
            
        }
    }

    // copy as markdown
    async function copyMarkdown() {
        const copyUrl = document.getElementById('copyUrl');
        const statusBar = document.getElementById('statusBar');

        const markdown = `<div align="center">\n <img src="${copyUrl.value}" alt="Mr Robot Quote"/>\n</div>`;
        
        try {
            await navigator.clipboard.writeText(markdown);
            statusBar.textContent = "Markdown Copied to Clipboard";
        } catch (err) {
            statusBar.textContent = 'Copy Failed!';
            consl.error('Clipboard error:', err);
        }
    }

    // Typing effect - types text one character at a time
    function typeWriter(text, element) {
        return new Promise((resolve) => {
            element.textContent = '';
            let i = 0;

            function type() {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, 25); // Speed of typing (ms per character)
                } else {
                    resolve(); // Done typing
                }
            }

            type();
        });
    }

    // Load a quote when the page first loads
    window.addEventListener('load', fetchQuoteText);
</script>
</body>
</html>
